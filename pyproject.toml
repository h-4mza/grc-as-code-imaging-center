[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grc-as-code"
version = "1.0.0"
description = "Outil de pilotage GRC as-code (EBIOS, ISO 27001, NIS2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.11.0",
    "psycopg2-binary>=2.9.7",
    "streamlit>=1.25.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.0.280",
    "pre-commit>=3.3.3",
    "mkdocs-material>=9.1.18"
]

[project.scripts]
grc = "app.cli:app"

[tool.ruff]
line-length = 120
select = ["E", "F", "I"]
