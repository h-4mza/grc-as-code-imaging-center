name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Pytest & Compliance Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate YAML Declarative Schemas
        run: |
          python -c "
          import glob, yaml, sys
          yaml_files = glob.glob('grc/**/*.yaml', recursive=True)
          print(f'Validating {len(yaml_files)} YAML files...')
          errors = 0
          for yf in yaml_files:
              try:
                  with open(yf, 'r', encoding='utf-8') as f:
                      yaml.safe_load(f)
              except Exception as e:
                  print(f'Error in {yf}: {e}', file=sys.stderr)
                  errors += 1
          if errors > 0:
              sys.exit(1)
          print('All GRC YAML files are syntactically valid!')
          "

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --tb=short
