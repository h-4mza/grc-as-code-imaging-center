name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Pytest & Compliance Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Validate YAML Declarative Schemas
        run: |
          python -c "import glob, yaml; [yaml.safe_load(open(f, encoding='utf-8')) for f in glob.glob('grc/**/*.yaml', recursive=True)]; print('All GRC YAML files are syntactically valid!')"

      - name: Lint Code with Ruff
        run: |
          ruff check .

      - name: Verify Compliance Matrix is Up-to-Date
        run: |
          grc export-matrix
          git diff --exit-code docs/compliance

      - name: Check Documentation for Forbidden Claims
        run: |
          python -c "
          import sys, glob
          forbidden = ['Statut : Approuvé', 'de plein droit']
          errors = [
              f'Forbidden phrase \"{t}\" found in {f}'
              for f in glob.glob('docs/**/*.md', recursive=True)
              for t in forbidden
              if t in open(f, encoding='utf-8').read()
          ]
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('Docs compliance language verification passed.')
          "

      - name: Build Documentation (MkDocs Strict)
        run: |
          mkdocs build --strict

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --tb=short
