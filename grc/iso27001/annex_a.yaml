- id: '8.29'
  name: Tests de sécurité
  description: 'Exigence ISO 27001 : Tests de sécurité'
  theme: Technologique
  is_applicable: false
  justification: 'Non applicable : Les tests de sécurité de code (SAST/DAST) sont
    réalisés en amont par les éditeurs tiers des logiciels d''imagerie médicale.'
  status: not_applicable
  maturity: null
  evidence: null
- id: '8.30'
  name: Développement externalisé
  description: 'Exigence ISO 27001 : Développement externalisé'
  theme: Technologique
  is_applicable: false
  justification: 'Non applicable : Le centre ne commande aucun développement logiciel
