  status: not_applicable
  maturity: null
  evidence: null
- id: '8.28'
  name: Sécurité du codage
  description: 'Exigence ISO 27001 : Sécurité du codage'
  theme: Technologique
  is_applicable: false
  justification: 'Non applicable : Aucune activité d''écriture de code source ou de
    développement applicatif n''est exercée par le personnel du centre. Les progiciels
    d''imagerie déployés sont des solutions du commerce maintenues par leurs éditeurs
    respectifs. L''intégrité et la robustesse du code incombent contractuellement
    aux éditeurs certifiés de la chaîne d''imagerie (mesure 21(2)e couverte par 8.8).'
  status: not_applicable
