- id: '8.31'
  name: Séparation environnements
  description: 'Exigence ISO 27001 : Séparation environnements'
  theme: Technologique
  is_applicable: false
  justification: 'Non applicable : Le centre n''opère aucun environnement de développement
    ou de compilation logicielle distinct de la production.'
  status: not_applicable
  maturity: null
  evidence: null
- id: '8.32'
  name: Gestion des changements
  description: 'Exigence ISO 27001 : Gestion des changements'
  theme: Technologique
  is_applicable: true
  justification: Toute modification d'infrastructure (mise à jour serveur PACS, reparamétrage
    réseau, ajout d'une modalité) est consignée dans un registre de changements et
    testée hors heures ouvrées. Un retour arrière est prévu avant chaque intervention.
  status: implemented
  maturity: 3
  evidence: Registre de suivi des changements informatiques et fiches d'intervention
- id: '8.33'
  name: Informations de test
  description: 'Exigence ISO 27001 : Informations de test'
  theme: Technologique
  is_applicable: false
  justification: 'Non applicable : Aucune création ou utilisation de bases de données
    de test pour du développement logiciel n''est requise dans le centre.'
  status: not_applicable
  maturity: null
  evidence: null
- id: '8.34'
  name: Protection systèmes d'audit
  description: 'Exigence ISO 27001 : Protection systèmes d''audit'
  theme: Technologique
  is_applicable: true
  justification: L'accès aux outils de diagnostic et de supervision réseau est restreint
    au référent informatique pour éviter tout détournement en écoute illégitime. Les
    audits et scans de vulnérabilités sont programmés en dehors des plages d'examens
    médicaux pour ne pas perturber les modalités.
  status: partial
  maturity: 2
  evidence: Procédure d'encadrement des audits techniques et calendrier des analyses
