stakeholders:
- id: pp_editeur_pacs
  name: Éditeur du PACS
  type: Fournisseur logiciel
  threat_level: 4
  dependency: Critique (Cœur du SI, accès télémaintenance privilégié)
- id: pp_maintenance
  name: Prestataire maintenance biomédicale
  type: Fournisseur service
  threat_level: 3
  dependency: Forte (Accès réseau aux modalités IRM/Scanner)
strategic_scenarios:
- id: sc_strat_1
  name: Compromission via l'éditeur PACS (Supply Chain)
  srov_id: srov_1
  stakeholder_id: pp_editeur_pacs
  likelihood: 3
  description: Des cybercriminels compromettent l'éditeur du PACS et déploient une
    mise à jour malveillante (ransomware) chez tous ses clients, y compris le centre
    d'imagerie.
- id: sc_strat_2
  name: Attaque via accès VPN partenaire
  srov_id: srov_1
  stakeholder_id: pp_maintenance
  likelihood: 4
  description: Un prestataire externe se fait voler ses accès, permettant aux attaquants
    d'entrer sur le réseau.
