site_name: GRC-as-Code
site_description: Plateforme GRC-as-Code - Piloter la gouvernance, les risques et la conformité (EBIOS RM, ISO 27001, NIS2) comme du code pour un centre d'imagerie médicale
repo_url: https://github.com/h-4mza/grc-as-code-imaging-center

theme:
  name: material
  palette:
    # Mode clair
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    # Mode sombre
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair

nav:
  - Accueil: index.md
  - EBIOS RM:
      - Atelier 1: ebios/atelier1.md
      - Atelier 2: ebios/atelier2.md
      - Atelier 3: ebios/atelier3.md
      - Atelier 4: ebios/atelier4.md
      - Atelier 5: ebios/atelier5.md
  - ISO 27001:
      - SoA (Déclaration Applicabilité): iso27001/soa.md
  - Conformité:
      - Applicabilité Réglementaire: compliance/applicabilite_reglementaire.md
