version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: grc_user
      POSTGRES_PASSWORD: grc_password
      POSTGRES_DB: grc_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://grc_user:grc_password@postgres/grc_db
    depends_on:
      - postgres
    volumes:
      - ./app:/app/app
      - ./grc:/app/grc
      - ./samples:/app/samples

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run dashboard/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    volumes:
      - ./dashboard:/app/dashboard

volumes:
  pgdata:
